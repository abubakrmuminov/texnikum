<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Tech Grid Overlay -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.12">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="850" cy="300" r="320" fill="url(#blueGlow)" filter="blur(60px)" />
  <circle cx="950" cy="280" r="180" fill="#eab308" opacity="0.2" filter="blur(50px)" />

  <!-- Abstract Medal / Trophy Artwork -->
  <g transform="translate(780, 180)">
    <!-- Laurel Wreath Glow -->
    <circle cx="160" cy="150" r="140" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="8 6" opacity="0.4" />
    <circle cx="160" cy="150" r="110" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.7" />
    
    <!-- Gold Medal Disc -->
    <circle cx="160" cy="150" r="90" fill="url(#gold)" opacity="0.95" />
    <circle cx="160" cy="150" r="78" fill="#1e1b4b" />
    
    <!-- Star Icon in Center -->
    <path d="M160 95 L175 135 L218 135 L183 160 L196 200 L160 176 L124 200 L137 160 L102 135 L145 135 Z" fill="url(#gold)" />
    
    <!-- Ribbon -->
    <path d="M120 70 L90 20 L135 20 L160 70 Z" fill="#3b82f6" />
    <path d="M200 70 L230 20 L185 20 L160 70 Z" fill="#2563eb" />
  </g>

  <!-- Decorative Typography Elements -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
    WorldSkills Uzbekistan 2026
  </text>
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#eab308">
    ★ OLTIN MEDAL GʻOLIBLARI ★
  </text>
  <text x="80" y="360" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#94a3b8">
    «Veb-texnologiyalar» va «Tarmoq maʼmurligi»
  </text>
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="16" fill="#64748b">
    Fargʻona shahri 2-son texnikumi iqtidorli yoshlari
  </text>
</svg>
