<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="admissionsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c192c" />
      <stop offset="60%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#05101e" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="amberBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#admissionsBg)" />

  <!-- Ambient Light -->
  <circle cx="850" cy="300" r="300" fill="url(#emeraldGlow)" filter="blur(60px)" />

  <!-- Graduation Graphic -->
  <g transform="translate(800, 190)">
    <!-- Cap Diamond -->
    <polygon points="150,50 280,100 150,150 20,100" fill="#3b82f6" opacity="0.9" />
    <polygon points="150,70 260,110 150,150 40,110" fill="#1d4ed8" />
    <!-- Skull Cap Base -->
    <path d="M70,120 Q150,220 230,120 Z" fill="#1e3a8a" opacity="0.95" />
    <!-- Tassel -->
    <path d="M150,100 Q190,120 220,170 L210,210" stroke="#f59e0b" stroke-width="6" fill="none" />
    <circle cx="210" cy="215" r="10" fill="#f59e0b" />
  </g>

  <!-- Typography -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
    Qabul komissiyasi 2026/2027
  </text>
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#10b981">
    75 ta Davlat granti oʻrinlari • my.edu.uz
  </text>
  <text x="80" y="360" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#94a3b8">
    9 va 11-sinf bitiruvchilari uchun professional taʼlim
  </text>
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="16" fill="#64748b">
    Kasb-hunar texnikumi • Hujjatlar 20-iyundan boshlab
  </text>
</svg>
